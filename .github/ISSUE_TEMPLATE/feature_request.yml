name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. BeziSync prioritizes features that make Debezium CDC safer, clearer, or easier to operate.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What CDC, Debezium, or operator problem does this solve?
      placeholder: Describe the problem or use case...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Describe your ideal solution...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of the application would this affect?
      options:
        - Not sure
        - Connectivity Checks
        - Preflight Validation
        - Config Compiler
        - Pipeline Deployment
        - Pipeline Observability
        - Source Signaling
        - Secrets/Security
        - Runtime Config
        - Frontend UI/UX
        - Source Connector Support
        - Target Sink Support
        - Operations/Deployment
        - Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be helpful
        - Important
        - Critical

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered workarounds or other designs?

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Links to similar tools, screenshots, mockups, or Debezium docs

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
