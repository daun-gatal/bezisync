# CI: every check a change must pass, and the container images it ships as.
# Runs on pull requests only, never again on main after a merge. A pull request carries a
# changelog fragment exactly when it changes an image or a chart (scripts/release.sh --changes),
# so merging it releases (push.yml); without such changes the image build and demo smoke test are
# skipped and the merge publishes nothing.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint and test run as parallel jobs: each is the slow half of the backend's checks.
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: golangci-lint (includes go vet)
        uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0, working-directory: backend }
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: OpenAPI document is current
        working-directory: backend
        run: |
          go run ./cmd/bezisync openapi --output /tmp/openapi.json
          diff -u ../frontend/openapi.json /tmp/openapi.json

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      # Same database as `make verify` locally (scripts/dev-db.sh): logical replication on, which a
      # service container cannot set. Tests reach it on its bridge address, because the SSRF guard
      # rightly refuses loopback.
      - name: Test database
        run: |
          scripts/dev-db.sh >/dev/null
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' bezisync-dev-pg)
          echo "BEZISYNC_TEST_DATABASE_URL=postgresql://bezisync:bezisync@${ip}:5432/bezisync" >> "$GITHUB_ENV"
      - name: Test (race detector, contract corpus, migration and check-reference drift)
        working-directory: backend
        run: go test -race ./...

  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version-file: tools/go.mod, cache: false }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0, working-directory: tools }
      - name: Vet and test (release tool, playground seeder, demo smoke test)
        working-directory: tools
        run: go vet ./... && go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Generated API client is current
        working-directory: frontend
        run: bun run check:api
      - name: Type check
        working-directory: frontend
        run: bun run typecheck
      - name: Unit tests
        working-directory: frontend
        run: bun run test
      - name: Build
        working-directory: frontend
        run: bun run build
      - name: Type check e2e suite
        working-directory: e2e
        run: npm ci && npx tsc --noEmit

  deploy:
    name: Helm charts and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          helm lint deploy/helm/bezisync --set secrets.masterKey=x --set postgres.enabled=true
          helm lint deploy/helm/bezisync-agent --set controlPlane.url=https://x --set token=bza_x
          helm lint deploy/helm/bezisync-agent --set controlPlane.url=https://x --set token=bza_x \
            --set kind=docker --set docker.host=tcp://docker:2375
      - name: Validate the demo compose file
        run: docker compose -f deploy/compose/docker-compose.yml config -q

  versions:
    name: Versions and changelog
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
      demo: ${{ steps.changes.outputs.demo }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }   # HEAD is the merge into main; HEAD^1 is main
      - uses: actions/setup-go@v6
        with: { go-version-file: tools/go.mod, cache: false }
      - name: A fragment exactly when an image or chart changes
        id: changes
        run: scripts/release.sh --changes HEAD^1 >> "$GITHUB_OUTPUT"
      - name: Backend, frontend and chart versions match
        run: echo "version $(scripts/release.sh --current)"
      - name: Changelog fragments are valid (and give a release version)
        run: |
          scripts/release.sh --next
          status=0
          for file in changelogs/unreleased/*.md; do
            [ -e "$file" ] || continue
            [ "$(basename "$file")" = README.md ] && continue
            head -1 "$file" | grep -qE '^type: (major|minor|patch)$' \
              || { echo "::error file=$file::first line must be 'type: major|minor|patch'"; status=1; }
            grep -qE '^### (Added|Changed|Fixed|Removed)' "$file" \
              || { echo "::error file=$file::needs a ### Added / Changed / Fixed / Removed section"; status=1; }
          done
          exit $status

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: anchore/scan-action@v6
        with: { path: ".", fail-build: true, severity-cutoff: high, output-format: table }

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend, backend-lint, tools, frontend, deploy, versions]
    if: needs.versions.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version-file: tools/go.mod, cache: false }
      - uses: docker/setup-buildx-action@v3
      - name: Build metadata
        id: meta
        run: |
          echo "version=$(scripts/release.sh --current)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Backend image `bezisync` (API, controller, agent, migrate, CLI)
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: bezisync:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image `bezisync-web`
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: bezisync-web:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  demo:
    name: Demo stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, backend-lint, tools, frontend, deploy, versions]
    if: needs.versions.outputs.demo == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version-file: tools/go.mod, cache: false }
      - name: Bring up the demo stack, stream through the sandbox, tear down
        run: scripts/demo-smoke.sh
