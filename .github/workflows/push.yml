# Push: on every merge to main, release when the merge brought changelog fragments; otherwise
# nothing. CI only lets a pull request carry fragments when it changes an image or a chart, and
# requires them when it does, so a merge without fragments leaves every published artifact as is.
#
#   Fragments in changelogs/unreleased/ → a release vX.Y.Z (highest fragment type wins):
#     scripts/release.sh (tools/cmd/release) writes the CHANGELOG.md section, deletes the fragments and sets the
#     version everywhere; the job commits "chore: release vX.Y.Z" to main, tags vX.Y.Z, builds the
#     images from that tag (the version is baked in) and creates the GitHub Release.
#       Images  :X.Y.Z, :vX.Y.Z, :latest, :sha-<short>, :main     Charts  X.Y.Z (appVersion X.Y.Z)
#       Images: bezisync (api, controller, agent, migrate, CLI: one binary) and bezisync-web (UI).
#
# CI does not run again after a merge: it ran on the pull request. The release commit only changes
# version fields, CHANGELOG.md and fragments; pushed with GITHUB_TOKEN it triggers no workflow.
# Images are signed with cosign (keyless) and given an SBOM attestation; charts are signed too.
name: Push

on:
  push:
    branches: [main]

# One at a time. A run that waits is replaced by a newer one, which is fine: every run works on
# the newest main, so it releases every fragment merged so far.
concurrency:
  group: push-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release (when the merge brought fragments)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write    # release commit and tag
    steps:
      - name: Check out the newest main
        uses: actions/checkout@v6
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version-file: tools/go.mod, cache: false }
      - name: Release the changelog fragments
        id: release
        run: |
          set -euo pipefail
          if ! ls changelogs/unreleased/*.md | grep -qv '/README.md$'; then
            echo "No changelog fragments: nothing to release or publish" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/release.sh
          version=$(scripts/release.sh --current)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::tag v$version already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CHANGELOG.md changelogs/unreleased backend frontend deploy/helm
          git commit -m "chore: release v$version"
          git tag -a "v$version" -m "Release v$version"
          # Atomic: if main moved meanwhile neither ref lands; the run for that newer merge releases.
          git push --atomic origin HEAD:main "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Released v$version" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the release
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write    # GitHub Release
      packages: write    # push to GHCR
      id-token: write    # keyless cosign signing
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with: { ref: "v${{ needs.release.outputs.version }}" }
      - uses: actions/setup-go@v6
        with: { go-version-file: tools/go.mod, cache: false }
      - name: Decide tags
        id: tags
        run: |
          sha=$(git rev-parse HEAD)
          {
            echo "sha=$sha"
            echo "tags=$VERSION v$VERSION latest sha-${sha::7} main"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/images"
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: bezisync:ci
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ steps.tags.outputs.sha }}
            BUILD_DATE=${{ steps.tags.outputs.created }}
          outputs: type=docker,dest=${{ runner.temp }}/images/backend.tar
          cache-from: type=gha,scope=backend
      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: bezisync-web:ci
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ steps.tags.outputs.sha }}
            BUILD_DATE=${{ steps.tags.outputs.created }}
          outputs: type=docker,dest=${{ runner.temp }}/images/frontend.tar
          cache-from: type=gha,scope=frontend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Push, sign and attest
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          OWNER: ${{ steps.tags.outputs.owner }}
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/images/backend.tar"
          docker load -i "$RUNNER_TEMP/images/frontend.tar"
          for name in bezisync bezisync-web; do
            repo="ghcr.io/$OWNER/$name"
            for tag in $TAGS; do
              docker tag "$name:ci" "$repo:$tag"
              docker push "$repo:$tag"
            done
            digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:${TAGS%% *}" | grep -m1 "^$repo@")
            cosign sign --yes "$digest"
            syft "$digest" -o spdx-json > "$RUNNER_TEMP/sbom-$name.spdx.json"
            cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom-$name.spdx.json" "$digest"
            echo "Published $repo ($TAGS) as $digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: azure/setup-helm@v4
      - name: Package, push and sign the Helm charts
        env:
          OWNER: ${{ steps.tags.outputs.owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          for chart in bezisync bezisync-agent; do
            helm package "deploy/helm/$chart" --version "$VERSION" --app-version "$VERSION" -d "$RUNNER_TEMP/charts"
            out=$(helm push "$RUNNER_TEMP/charts/$chart-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1)
            echo "$out"
            digest=$(echo "$out" | awk '/^Digest:/ {print $2}')
            cosign sign --yes "ghcr.io/$OWNER/charts/$chart@$digest"
            echo "Published chart oci://ghcr.io/$OWNER/charts/$chart:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          scripts/release.sh --notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --latest --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "GitHub Release v$VERSION created" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the release (when AUTO_DEPLOY is on)
    needs: [release, publish]
    if: vars.AUTO_DEPLOY == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      action: apply
      image_tag: ${{ needs.release.outputs.version }}
    secrets: inherit
