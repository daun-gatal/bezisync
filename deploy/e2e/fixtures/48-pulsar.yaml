# Apache Pulsar standalone, no authentication: pulsar://pulsar:6650 (binary), http://pulsar:8080 (admin).
apiVersion: apps/v1
kind: Deployment
metadata: { name: pulsar }
spec:
  replicas: 1
  selector: { matchLabels: { app: pulsar } }
  template:
    metadata: { labels: { app: pulsar, app.bezisync.io/fixture: "true" } }
    spec:
      enableServiceLinks: false
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:4.2.5
          command: [bin/pulsar, standalone, -nfw, -nss]
          env:
            - { name: PULSAR_MEM, value: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m" }
          ports: [{ containerPort: 6650 }, { containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /admin/v2/brokers/health, port: 8080 }, periodSeconds: 5, timeoutSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: pulsar }
spec:
  selector: { app: pulsar }
  ports: [{ name: binary, port: 6650, targetPort: 6650 }, { name: admin, port: 8080, targetPort: 8080 }]
