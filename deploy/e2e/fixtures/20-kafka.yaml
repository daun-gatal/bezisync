# Single-node KRaft Kafka. In-cluster: kafka.bezisync-e2e-data:9092. Runner: bezisync-e2e-k3s:30092.
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka, app.bezisync.io/fixture: "true" } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.3.2
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,EXTERNAL://:30092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka.bezisync-e2e-data.svc.cluster.local:9092,EXTERNAL://bezisync-e2e-k3s:30092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m" }
          ports: [{ containerPort: 9092 }, { containerPort: 30092 }]
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 3, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  type: NodePort
  selector: { app: kafka }
  ports:
    - { name: internal, port: 9092, targetPort: 9092, nodePort: 30093 }
    - { name: external, port: 30092, targetPort: 30092, nodePort: 30092 }
