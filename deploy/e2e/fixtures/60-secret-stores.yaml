# External secret stores: Vault in dev mode (KV v2 at secret/) and moto for AWS Secrets
# Manager. Runner NodePorts: vault 30820, moto 30500.
apiVersion: apps/v1
kind: Deployment
metadata: { name: vault }
spec:
  replicas: 1
  selector: { matchLabels: { app: vault } }
  template:
    metadata: { labels: { app: vault, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.20.4
          args: [server, -dev, -dev-root-token-id=e2e-vault-root, -dev-listen-address=0.0.0.0:8200]
          env: [{ name: SKIP_SETCAP, value: "true" }]
          ports: [{ containerPort: 8200 }]
          readinessProbe: { httpGet: { path: /v1/sys/health, port: 8200 }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: vault }
spec:
  type: NodePort
  selector: { app: vault }
  ports: [{ port: 8200, targetPort: 8200, nodePort: 30820 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: moto }
spec:
  replicas: 1
  selector: { matchLabels: { app: moto } }
  template:
    metadata: { labels: { app: moto, app.bezisync.io/fixture: "true" } }
    spec:
      enableServiceLinks: false
      containers:
        - name: moto
          image: motoserver/moto:5.1.14
          ports: [{ containerPort: 5000 }]
          readinessProbe: { tcpSocket: { port: 5000 }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: moto }
spec:
  type: NodePort
  selector: { app: moto }
  ports: [{ port: 5000, targetPort: 5000, nodePort: 30500 }]
