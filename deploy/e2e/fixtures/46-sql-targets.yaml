# JDBC destinations: target-pg:5432 (database warehouse, schema public) and target-mysql:3306
# (database warehouse), user bz_writer / bz-writer-pw with rights to create tables.
apiVersion: apps/v1
kind: Deployment
metadata: { name: target-pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: target-pg } }
  template:
    metadata: { labels: { app: target-pg, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - { name: POSTGRES_DB, value: warehouse }
            - { name: POSTGRES_USER, value: bz_writer }
            - { name: POSTGRES_PASSWORD, value: bz-writer-pw }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, bz_writer, -d, warehouse] }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: target-pg }
spec:
  selector: { app: target-pg }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: target-mysql }
spec:
  replicas: 1
  selector: { matchLabels: { app: target-mysql } }
  template:
    metadata: { labels: { app: target-mysql, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: target-root-pw }
            - { name: MYSQL_DATABASE, value: warehouse }
            - { name: MYSQL_USER, value: bz_writer }
            - { name: MYSQL_PASSWORD, value: bz-writer-pw }
          ports: [{ containerPort: 3306 }]
          readinessProbe: { exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -ubz_writer -pbz-writer-pw'] }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: target-mysql }
spec:
  selector: { app: target-mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
