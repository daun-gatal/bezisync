# A Docker host for the agent-mode Docker runtime (stands in for a remote VM).
# Images live on a hostPath inside the k3s data volume so they survive between runs and
# avoid overlay-on-overlay storage; `scripts/e2e.sh down` removes that volume.
apiVersion: apps/v1
kind: Deployment
metadata: { name: dind }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dind } }
  template:
    metadata: { labels: { app: dind, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: dind
          image: docker:28.5-dind
          args: [--tls=false, --host=tcp://0.0.0.0:2375]
          env: [{ name: DOCKER_TLS_CERTDIR, value: "" }]
          securityContext: { privileged: true }
          ports: [{ containerPort: 2375 }]
          readinessProbe: { exec: { command: [docker, -H, tcp://127.0.0.1:2375, info] }, periodSeconds: 3 }
          volumeMounts: [{ name: data, mountPath: /var/lib/docker }]
      volumes:
        - name: data
          hostPath: { path: /var/lib/rancher/k3s/e2e-dind, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata: { name: dind }
spec:
  selector: { app: dind }
  ports: [{ port: 2375, targetPort: 2375 }]
