# Oracle XE 21c (multitenant: CDB XE, PDB XEPDB1) for Flink CDC's Oracle reader, which can't read
# Oracle Database Free (ADR 0006): ARCHIVELOG, supplemental logging, the LogMiner common user with
# Debezium's grants plus ANALYZE ANY (the first copy analyzes each table). LOG_MINING_FLUSH is not
# created here: BeziSync's Prepare must create it in the CDB root.
# In-cluster: source-oracle-xe.bezisync-e2e-data:1521. Specs write rows with
# `kubectl exec deploy/source-oracle-xe -- sqlplus` (no Oracle client in the runner).
apiVersion: v1
kind: ConfigMap
metadata: { name: source-oracle-xe-init }
data:
  # Runs once, after the database is created (gvenzl/oracle-free container-entrypoint-initdb.d).
  01-cdc.sh: |
    #!/bin/bash
    set -e
    sqlplus -s / as sysdba <<'SQL'
    WHENEVER SQLERROR EXIT FAILURE
    SHUTDOWN IMMEDIATE
    STARTUP MOUNT
    ALTER DATABASE ARCHIVELOG;
    ALTER DATABASE OPEN;
    ALTER PLUGGABLE DATABASE ALL OPEN;
    ALTER DATABASE ADD SUPPLEMENTAL LOG DATA;
    CREATE USER c##cdc_reader IDENTIFIED BY "cdc-reader-pw" DEFAULT TABLESPACE users QUOTA UNLIMITED ON users CONTAINER=ALL;
    GRANT CREATE SESSION, SET CONTAINER, FLASHBACK ANY TABLE, SELECT ANY TABLE, SELECT_CATALOG_ROLE, EXECUTE_CATALOG_ROLE,
      SELECT ANY TRANSACTION, LOGMINING, CREATE TABLE, LOCK ANY TABLE, CREATE SEQUENCE TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$DATABASE TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$LOG TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$LOG_HISTORY TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$LOGMNR_LOGS TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$LOGMNR_CONTENTS TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$LOGMNR_PARAMETERS TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$LOGFILE TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$ARCHIVED_LOG TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$ARCHIVE_DEST_STATUS TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$TRANSACTION TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$MYSTAT TO c##cdc_reader CONTAINER=ALL;
    GRANT SELECT ON V_$STATNAME TO c##cdc_reader CONTAINER=ALL;
    GRANT EXECUTE ON DBMS_LOGMNR TO c##cdc_reader CONTAINER=ALL;
    GRANT EXECUTE ON DBMS_LOGMNR_D TO c##cdc_reader CONTAINER=ALL;
    GRANT ANALYZE ANY TO c##cdc_reader CONTAINER=ALL;
    ALTER SESSION SET CONTAINER = XEPDB1;
    ALTER USER c##cdc_reader QUOTA UNLIMITED ON users;
    CREATE TABLE shop.orders (id NUMBER(10) GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, status VARCHAR2(40) NOT NULL,
      email VARCHAR2(200), total NUMBER(10,2), created TIMESTAMP DEFAULT SYSTIMESTAMP);
    ALTER TABLE shop.orders ADD SUPPLEMENTAL LOG DATA (ALL) COLUMNS;
    INSERT INTO shop.orders (status, email, total) VALUES ('NEW', 'a@example.com', 1);
    INSERT INTO shop.orders (status, email, total) VALUES ('PAID', 'b@example.com', 2);
    COMMIT;
    SQL
    touch /tmp/ready
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: source-oracle-xe }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: source-oracle-xe } }
  template:
    metadata: { labels: { app: source-oracle-xe, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-xe:21-slim-faststart@sha256:f82bccdf6020d27373fdf0e93046b63eb3f777a0289e329d9839feebaf4555de
          env:
            - { name: ORACLE_PASSWORD, value: "oracle-sys-pw" }
            - { name: APP_USER, value: shop }
            - { name: APP_USER_PASSWORD, value: "shop-pw" }
          ports: [{ containerPort: 1521 }]
          readinessProbe: { exec: { command: [test, -f, /tmp/ready] }, periodSeconds: 5, failureThreshold: 120 }
          resources: { requests: { memory: 2Gi } }
          volumeMounts: [{ name: init, mountPath: /container-entrypoint-initdb.d }]
      volumes: [{ name: init, configMap: { name: source-oracle-xe-init, defaultMode: 0755 } }]
---
apiVersion: v1
kind: Service
metadata: { name: source-oracle-xe }
spec:
  selector: { app: source-oracle-xe }
  ports: [{ port: 1521, targetPort: 1521 }]
