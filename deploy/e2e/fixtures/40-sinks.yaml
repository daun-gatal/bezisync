# Non-Kafka destinations. In-cluster names: redis:6379, nats:4222, kinesis:4566 (kinesis-mock), pubsub:8681.
# Runner NodePorts: redis 30379, nats 30422, kinesis 30566, pubsub 30681.
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: redis
          image: redis:7.4
          args: [--requirepass, redis-pw]
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, -a, redis-pw, ping] }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  type: NodePort
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379, nodePort: 30379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nats }
spec:
  replicas: 1
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: nats
          image: nats:2.11
          args: [-js]
          ports: [{ containerPort: 4222 }]
          readinessProbe: { tcpSocket: { port: 4222 }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: nats }
spec:
  type: NodePort
  selector: { app: nats }
  ports: [{ port: 4222, targetPort: 4222, nodePort: 30422 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kinesis }
spec:
  replicas: 1
  selector: { matchLabels: { app: kinesis } }
  template:
    metadata: { labels: { app: kinesis, app.bezisync.io/fixture: "true" } }
    spec:
      enableServiceLinks: false   # KINESIS_* service env vars would collide with its config
      containers:
        - name: kinesis
          image: ghcr.io/etspaceman/kinesis-mock:0.4.13
          env:
            - { name: CREATE_STREAM_DURATION, value: 200ms }
          ports: [{ containerPort: 4568 }]   # plain HTTP (4567 is TLS)
          readinessProbe: { tcpSocket: { port: 4568 }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: kinesis }
spec:
  type: NodePort
  selector: { app: kinesis }
  ports: [{ port: 4566, targetPort: 4568, nodePort: 30566 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pubsub }
spec:
  replicas: 1
  selector: { matchLabels: { app: pubsub } }
  template:
    metadata: { labels: { app: pubsub, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: pubsub
          image: thekevjames/gcloud-pubsub-emulator:590.0.1
          ports: [{ containerPort: 8681 }]
          readinessProbe: { tcpSocket: { port: 8681 }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: pubsub }
spec:
  type: NodePort
  selector: { app: pubsub }
  ports: [{ port: 8681, targetPort: 8681, nodePort: 30681 }]
