# CDC-ready PostgreSQL with a small shop schema. Reachable in-cluster as
# source-pg.bezisync-e2e-data:5432 and from the e2e runner as bezisync-e2e-k3s:30432.
apiVersion: v1
kind: ConfigMap
metadata: { name: source-pg-init }
data:
  init.sql: |
    CREATE ROLE cdc_reader LOGIN REPLICATION PASSWORD 'cdc-reader-pw';
    GRANT CREATE ON DATABASE shop TO cdc_reader;
    CREATE SCHEMA shop AUTHORIZATION cdc_reader;
    SET ROLE cdc_reader;
    CREATE TABLE shop.customers (id serial PRIMARY KEY, name text NOT NULL, email text, phone text);
    CREATE TABLE shop.orders (id serial PRIMARY KEY, customer_id int REFERENCES shop.customers(id), status text NOT NULL, total numeric(10,2), created_at timestamptz DEFAULT now());
    CREATE TABLE shop.order_items (id serial PRIMARY KEY, order_id int REFERENCES shop.orders(id), sku text, qty int);
    CREATE TABLE shop.payment_events (order_id int, payload text);
    INSERT INTO shop.customers (name, email, phone) SELECT 'Customer ' || g, 'c' || g || '@example.com', '+1555' || g FROM generate_series(1, 50) g;
    INSERT INTO shop.orders (customer_id, status, total) SELECT 1 + (g % 50), 'NEW', g FROM generate_series(1, 200) g;
    INSERT INTO shop.order_items (order_id, sku, qty) SELECT 1 + (g % 200), 'SKU-' || g, 1 FROM generate_series(1, 300) g;
    RESET ROLE;
    CREATE ROLE e2e_writer LOGIN PASSWORD 'e2e-writer-pw';
    GRANT USAGE ON SCHEMA shop TO e2e_writer;
    GRANT ALL ON ALL TABLES IN SCHEMA shop TO e2e_writer;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA shop TO e2e_writer;
    GRANT pg_signal_backend TO e2e_writer;
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: source-pg }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: source-pg } }
  template:
    metadata: { labels: { app: source-pg, app.bezisync.io/fixture: "true" } }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          args: [-c, wal_level=logical, -c, max_replication_slots=20, -c, max_wal_senders=20]
          env:
            - { name: POSTGRES_PASSWORD, value: source-admin-pw }
            - { name: POSTGRES_DB, value: shop }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, postgres, -d, shop] }, periodSeconds: 3 }
          volumeMounts: [{ name: init, mountPath: /docker-entrypoint-initdb.d }]
      volumes: [{ name: init, configMap: { name: source-pg-init } }]
---
apiVersion: v1
kind: Service
metadata: { name: source-pg }
spec:
  type: NodePort
  selector: { app: source-pg }
  ports: [{ port: 5432, targetPort: 5432, nodePort: 30432 }]
