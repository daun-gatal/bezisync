# Single-node MongoDB 7 replica set. In-cluster: source-mongo.source-mongo-hl.bezisync-e2e-data:27017; runner: bezisync-e2e-k3s:30017 (directConnection).
apiVersion: v1
kind: ConfigMap
metadata: { name: source-mongo-init }
data:
  init.sh: |
    until mongosh --quiet --host localhost --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; do sleep 2; done
    mongosh --quiet --host localhost --eval '
      try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "source-mongo.source-mongo-hl.bezisync-e2e-data.svc.cluster.local:27017"}]}) }
      while (!db.hello().isWritablePrimary) { sleep(500) }
      const admin = db.getSiblingDB("admin");
      if (!admin.getUser("cdc_reader")) admin.createUser({user: "cdc_reader", pwd: "cdc-reader-pw", roles: ["readAnyDatabase", {role: "readWrite", db: "bezisync"}, {role: "read", db: "local"}]});
      if (!admin.getUser("e2e_writer")) admin.createUser({user: "e2e_writer", pwd: "e2e-writer-pw", roles: [{role: "readWrite", db: "shop"}]});
      const shop = db.getSiblingDB("shop");
      if (shop.customers.countDocuments() === 0) shop.customers.insertMany([{name: "Ada", email: "ada@example.com"}, {name: "Lin", email: "lin@example.com"}]);
    '
    touch /tmp/ready
    sleep infinity
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: source-mongo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: source-mongo } }
  template:
    metadata: { labels: { app: source-mongo, app.bezisync.io/fixture: "true" } }
    spec:
      # A stable, self-resolving hostname: replica-set members must map their own host name.
      hostname: source-mongo
      subdomain: source-mongo-hl
      containers:
        - name: mongo
          image: mongo:7
          args: [--replSet, rs0, --bind_ip_all]
          ports: [{ containerPort: 27017 }]
          readinessProbe: { exec: { command: [mongosh, --quiet, --eval, "db.hello().isWritablePrimary || quit(1)"] }, periodSeconds: 3 }
        - name: init
          image: mongo:7
          command: [bash, /init/init.sh]
          readinessProbe: { exec: { command: [test, -f, /tmp/ready] }, periodSeconds: 3 }
          volumeMounts: [{ name: init, mountPath: /init }]
      volumes: [{ name: init, configMap: { name: source-mongo-init } }]
---
apiVersion: v1
kind: Service
metadata: { name: source-mongo }
spec:
  type: NodePort
  selector: { app: source-mongo }
  ports: [{ port: 27017, targetPort: 27017, nodePort: 30017 }]
---
apiVersion: v1
kind: Service
metadata: { name: source-mongo-hl }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: source-mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
