apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bezisync.fullname" . }}-web
  labels: {{- include "bezisync.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: {{- include "bezisync.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $pod := dict "runAsNonRoot" true "runAsUser" 101 "seccompProfile" (dict "type" "RuntimeDefault") }}
      securityContext: {{- include "bezisync.podSecurityContext" (dict "root" . "base" $pod) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "bezisync.webImage" . }}
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          env:
            - name: BEZISYNC_API_UPSTREAM
              value: http://{{ include "bezisync.fullname" . }}-api:8000
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bezisync.fullname" . }}
  labels: {{- include "bezisync.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
