{{- if not .Values.existingSecret }}
{{- $dbUrl := .Values.secrets.databaseUrl }}
{{- if and .Values.postgres.enabled (not $dbUrl) }}
{{- $dbUrl = printf "postgresql+psycopg://bezisync:%s@%s-postgres.%s.svc:5432/bezisync" .Values.postgres.password (include "bezisync.fullname" .) .Release.Namespace }}
{{- end }}
{{- if not $dbUrl }}{{ fail "secrets.databaseUrl is required unless postgres.enabled or existingSecret" }}{{ end }}
{{- if not .Values.secrets.masterKey }}{{ fail "secrets.masterKey is required (bezisync generate-master-key)" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bezisync.secretName" . }}
  labels: {{- include "bezisync.labels" . | nindent 4 }}
type: Opaque
stringData:
  BEZISYNC_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  BEZISYNC_DATABASE_URL: {{ $dbUrl | quote }}
  {{- with .Values.secrets.stateDatabaseUrl }}
  BEZISYNC_STATE_DATABASE_URL: {{ . | quote }}
  {{- end }}
  BEZISYNC_BOOTSTRAP_ADMIN_EMAIL: {{ .Values.secrets.bootstrapAdminEmail | quote }}
  {{- with .Values.secrets.bootstrapAdminPassword }}
  BEZISYNC_BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
