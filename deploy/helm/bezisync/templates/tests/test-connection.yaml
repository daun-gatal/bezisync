{{- /* helm test: the API is ready (its database answers) and the web Service reaches the API. */ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bezisync.fullname" . }}-test
  labels: {{- include "bezisync.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext: {{- include "bezisync.podSecurityContext" (dict "root" . "base" .Values.podSecurityContext) | nindent 4 }}
  containers:
    - name: api-ready
      image: {{ include "bezisync.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: [healthcheck, --url, "http://{{ include "bezisync.fullname" . }}-api:8000/readyz"]
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
    - name: web-to-api
      image: {{ include "bezisync.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: [healthcheck, --url, "http://{{ include "bezisync.fullname" . }}:{{ .Values.service.port }}/healthz"]
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
