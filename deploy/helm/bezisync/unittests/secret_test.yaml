suite: secret
templates: [templates/secret.yaml]
tests:
  - it: refuses to render without a master key
    set: { postgres.enabled: true }
    asserts:
      - failedTemplate: { errorMessage: "secrets.masterKey is required (bezisync generate-master-key)" }
  - it: refuses to render without a database
    set: { secrets.masterKey: x }
    asserts:
      - failedTemplate: { errorMessage: "secrets.databaseUrl is required unless postgres.enabled or existingSecret" }
  - it: points at the bundled PostgreSQL
    release: { name: bz, namespace: cdc }
    set: { secrets.masterKey: x, postgres.enabled: true, postgres.password: pw }
    asserts:
      - equal: { path: stringData.BEZISYNC_DATABASE_URL, value: "postgresql+psycopg://bezisync:pw@bz-postgres.cdc.svc:5432/bezisync" }
      - notExists: { path: stringData.BEZISYNC_BOOTSTRAP_ADMIN_PASSWORD }
  - it: takes an external database and the admin password
    set: { secrets.masterKey: x, secrets.databaseUrl: "postgresql://u:p@db:5432/b", secrets.bootstrapAdminPassword: s3cret }
    asserts:
      - equal: { path: stringData.BEZISYNC_DATABASE_URL, value: "postgresql://u:p@db:5432/b" }
      - equal: { path: stringData.BEZISYNC_BOOTSTRAP_ADMIN_PASSWORD, value: s3cret }
  - it: renders nothing with an existing Secret
    set: { existingSecret: mine }
    asserts:
      - hasDocuments: { count: 0 }
