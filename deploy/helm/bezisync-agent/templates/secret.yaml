{{- if not .Values.existingSecret }}
{{- if not .Values.token }}{{ fail "token is required (shown once when the runtime was added) unless existingSecret is set" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.secretName" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  BEZISYNC_AGENT_TOKEN: {{ .Values.token | quote }}
{{- end }}
