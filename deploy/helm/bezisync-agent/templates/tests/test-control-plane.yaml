{{- /* helm test: the agent's network reaches the control plane it dials. */ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "agent.fullname" . }}-test
  labels: {{- include "agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: control-plane
      image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: [healthcheck, --url, "{{ trimSuffix "/" .Values.controlPlane.url }}/healthz"]
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
